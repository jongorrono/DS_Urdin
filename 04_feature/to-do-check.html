<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/tokens-primitives.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/buttons.css">
     <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>
   <header>
    </header> 
    <h1>TO-do with states </h1>
    <div class="container-to-do">
    <h1>To-do</h1>
    <div class="content-to-do">
    <div class="header">
        <input id="input">
        <button onclick="AddItem()">ADD</button>
    </div>
        <ul id='list'>
        </ul>
    
    </div>
    </div>
</body>
</html>

<script>
function AddItem()
{
    let input1=document.getElementById('input');//collects de value from input. 
    let valueInput=input1.value;
    input1.value="";
    
    //create a new dom element
    let listElement=document.createElement ('li');

// create a paragraph. 
    let textP=document.createElement('p');
    textP.textContent=valueInput;
    textP.classList.add ("to-do-text");
    
//Create a text node
    let text = document.createTextNode(valueInput);


//Create a check elemenent
    let check=document.createElement('input');
    check.checked=false;
    check.type="checkbox";
    
    
//Create a button. 
   let button=document.createElement ('button'); 
  button.textContent='DELETE';
 button.classList.add("delete-button");

    button.addEventListener("click",DeleteTask);
    
//add to the DOM
        
    listElement.appendChild(check);
    document.getElementById("list").appendChild(listElement);
    listElement.appendChild(textP);

 check.classList.add("check-style");
  check.addEventListener("change",LineThrough);
   listElement.appendChild(button);


}
function DeleteTask(event)
{
    event.target.parentElement.remove();
}

function LineThrough(event)
{
  const checkbox=event.target;
  if (checkbox.checked==true)
    {
        const nodo=checkbox.nextElementSibling;
        nodo.style.textDecoration="line-through";
    }
else
    {
        const nodo=checkbox.nextElementSibling;
        nodo.style.textDecoration="none";
    }
 
}

</script>
