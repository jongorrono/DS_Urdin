<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty Page</title>
  </head>
  <body>
    <p id="demo"</p>
    <button type="button" onclick="myFunction()">Click me</button>
    <script>
      let X = "JonGo"; 
      let Y = "Gozuga";
      function myFunction()
      {
        document.getElementById("demo").innerHTML = X+Y; 
      }
    </script>
  </body>
</html>
